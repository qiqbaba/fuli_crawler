name: Cloud PDF Backfill (一键云端批量补全缺失 PDF)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: '单次补充的最大记录数 (默认 1000，填 0 表示全部处理)'
        required: true
        default: '1000'
      workers:
        description: '并发线程数 (GitHub Actions 建议 4-8)'
        required: true
        default: '6'
      source:
        description: '指定补全的来源站点 (默认 all，可选 u3c3, dashen, jingpin_toupai, gcbt, taose 等)'
        required: true
        default: 'all'
      start_date:
        description: '检索起始日期 (格式 YYYY-MM-DD，默认 2026-09-12)'
        required: false
        default: '2026-09-12'
      enable_proxy:
        description: '是否启用代理 (开启后自动获取并轮换免费代理，复用主任务缓存)'
        type: boolean
        default: true
      refresh_proxy:
        description: '是否强制重新获取代理 (不复用旧缓存，从网络重新拉取并验证新代理)'
        type: boolean
        default: false
      dry_run:
        description: '仅检索并预览待补全记录，不实际生成与上传'
        type: boolean
        default: false

jobs:
  backfill-pdfs:
    name: Backfill Missing PDFs to R2 & Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 恢复代理 IP 缓存（复用主任务共享缓存）
        if: inputs.enable_proxy && !inputs.refresh_proxy
        uses: actions/cache/restore@v6.1.0
        with:
          path: temp_profiles/
          key: proxy-cache-latest
          restore-keys: |
            proxy-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Create temp PDF directory
        run: |
          mkdir -p /tmp/pdf

      - name: 预热代理池（获取 250 个可用代理后放行）
        if: inputs.enable_proxy
        env:
          ENABLE_PROXY_MANAGER: 'true'
          CRAWLER_PROXY: ${{ secrets.CRAWLER_PROXY }}
          REFRESH_PROXY: ${{ inputs.refresh_proxy }}
          PROXY_VERIFY_WORKERS: '200'
          PROXY_VERIFY_POST_START_WORKERS: '40'
        run: |
          python -c "
          import os
          from utils.proxy_manager import init_proxy_manager
          force = os.environ.get('REFRESH_PROXY', 'false').lower() == 'true'
          mgr = init_proxy_manager(force_fetch=force, force_verify=force, target_count=1000, start_threshold=250, post_start_workers=40)
          if mgr:
              stats = mgr.get_stats()
              print(f'代理池预热完成: 总计 {stats[\"total\"]} 个, 可用 {stats[\"working\"]} 个 (达到 250 个后放行，爬虫中将继续验证)')
          else:
              print('代理管理器未启用')
          "

      - name: Run PDF Backfill (启动爬虫并后台继续验证代理)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_CUSTOM_DOMAIN: ${{ secrets.R2_CUSTOM_DOMAIN }}
          RUN_MODE: cloud
          PDF_BASE_DIR: /tmp/pdf
          ENABLE_PROXY_MANAGER: ${{ inputs.enable_proxy }}
          CRAWLER_PROXY: ${{ secrets.CRAWLER_PROXY }}
          REFRESH_PROXY: ${{ inputs.refresh_proxy }}
          PROXY_START_THRESHOLD: '250'
          PROXY_VERIFY_WORKERS: '200'
          PROXY_VERIFY_POST_START_WORKERS: '40'
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          
          python fixes/backfill_missing_pdfs.py \
            --batch-size ${{ inputs.batch_size }} \
            --workers ${{ inputs.workers }} \
            --source ${{ inputs.source }} \
            --start-date "${{ inputs.start_date }}" \
            --proxy-start-threshold 250 \
            $DRY_RUN_ARG

      - name: 保存全新代理 IP 缓存
        if: always() && inputs.enable_proxy && inputs.refresh_proxy
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: temp_profiles/
          key: proxy-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cleanup Temp Directory & Profiles
        if: always()
        run: |
          rm -rf /tmp/pdf
          if [ -d temp_profiles ]; then
            find temp_profiles -maxdepth 1 -type d -name 'profile_*' -exec rm -rf {} + || true
          fi
