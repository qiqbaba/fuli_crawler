[project]
name = "fuli-crawler"
version = "0.1.0"
description = "Fuli Crawler Project"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "playwright",
    "supabase",
    "boto3",
    "python-dotenv",
    "curl-cffi",
    "aiohttp",
    "aiohttp-socks",
    "pysocks",
    "lingua-language-detector",
    "flask",
    "streamlit",
    "pandas",
    "pymupdf",
    "fastapi>=0.162.2",
    "uvicorn>=0.53.0",
]

[tool.uv]
managed = true
